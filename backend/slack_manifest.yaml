display_information:
  name: Bridge
  description: Connects you with colleagues who've done similar work.
  background_color: "#1f2937"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Bridge
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:write
      - mpim:write
      - im:history
      - mpim:history
      - users:read
      # Not in spec §10, but required for Slack ingest (§6.3): read public channels the bot is in.
      - channels:history
settings:
  event_subscriptions:
    bot_events:
      - message.im
      - message.mpim
      # Not in spec §10, but required for Slack ingest (§6.3).
      - message.channels
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
